<!--
1) განსხვავება Container Tag-სა და Empty Tag-ს შორის

Container Tag - აქვს გამხსნელი და დამხურავი ტეგი
მაგალითი:
<p>ტექსტი</p>

Empty Tag - არ აქვს დამხურავი ტეგი და შიგნით კონტენტი არ იწერება
მაგალითი
-->

<!--
2) 

კარგი პრაქტიკა:
კოდის სწორად ფორმატირება
ტეგების სწორად დახურვა
გასაგები სახელების გამოყენება
კომენტარების გამოყენება საჭირო ადგილებში

ცუდი პრაქტიკა:
არეული და უფორმატო კოდი
ტეგების არასწორად დახურვა
გაუგებარი სახელების გამოყენება
ზედმეტი და განმეორებადი კოდის წერა
-->

<!DOCTYPE html>
<html>
<head>
    <title>ფეხბურთი</title>
</head>
<body>

    <h1>ფეხბურთი</h1>

    <h2>ყველაზე პოპულარული სპორტი</h2>

   
    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" alt="ფეხბურთის ბურთი" width="200">

  
    <img src="football.jpg" alt="ფეხბურთელი" width="300">

    <p>
        ფეხბურთი მსოფლიოში ერთ-ერთი ყველაზე პოპულარული სპორტია
    </p>

    <p>
        მას თამაშობენ მილიონობით ადამიანი სხვადასხვა ქვეყანაში
    </p>

    <button>დამაჭირე</button>

</body>
</html>
