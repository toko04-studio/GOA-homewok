<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>რეგისტრაცია</h2>

    <form>
        <label for="fullname">სრული სახელი:</label>
        <input type="text" id="fullname" name="fullname" placeholder="შეიყვანეთ სახელი" required minlength="3">
        <br><br>

        <label for="email">ემაილი:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        <br><br>

        <label for="password">პაროლი:</label>
        <input type="password" id="password" name="password" placeholder="შეიყვანეთ პაროლი" required minlength="6">
        <br><br>

        <input type="submit" value="რეგისტრაცია">
    </form>

</body>
</html>



<!DOCTYPE html>
<html>
<head>
    <title>Input Types</title>
</head>
<body>

    <h2>Input Types</h2>

    <label>Text:</label>
    <input type="text"><br><br>

    <label>Password:</label>
    <input type="password"><br><br>

    <label>Email:</label>
    <input type="email"><br><br>

    <label>Number:</label>
    <input type="number"><br><br>

    <label>Date:</label>
    <input type="date"><br><br>

    <label>Time:</label>
    <input type="time"><br><br>

    <label>Color:</label>
    <input type="color"><br><br>

    <label>Checkbox:</label>
    <input type="checkbox"><br><br>

    <label>Radio:</label>
    <input type="radio"><br><br>

    <label>File:</label>
    <input type="file"><br><br>

    <label>Range:</label>
    <input type="range"><br><br>

    <label>Submit:</label>
    <input type="submit">

</body>
</html>
