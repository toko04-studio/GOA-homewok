
```html
<!-- video თეგი გამოიყენება ვიდეოს გამოსატანად -->
<video controls>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- audio თეგი გამოიყენება აუდიოს გამოსატანად -->
<audio controls>
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<!-- source თეგი უთითებს ფაილის მისამართს -->

<!-- type ატრიბუტი უთითებს ფაილის ტიპს -->
```


```html
<!-- controls - აჩენს ვიდეოს სამართავ ღილაკებს -->
<video controls></video>

<!-- autoplay - ვიდეო ავტომატურად ირთვება -->
<video autoplay></video>

<!-- muted - ვიდეო იწყება უხმოდ -->
<video muted></video>

<!-- loop - ვიდეო უსასრულოდ მეორდება -->
<video loop></video>

<!-- width - ვიდეოს სიგანე -->
<video width="500"></video>

<!-- height - ვიდეოს სიმაღლე -->
<video height="300"></video>

<!-- poster - ვიდეოს ჩართვამდე აჩვენებს სურათს -->
<video poster="image.jpg"></video>
```



```html
<!DOCTYPE html>
