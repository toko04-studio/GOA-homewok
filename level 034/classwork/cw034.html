<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Pseudo Selectors</title>

    <style>
        body {
            background: #242424;
            color: white;
            font-family: Arial, sans-serif;
        }

        a:link {
            color: white;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: blue;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            color: #222;
            border-radius: 10px;
            overflow: hidden;
            font-size: 14px;
        }

        th, td {
            padding: 7px 15px;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e9e9e9;
            font-weight: bold;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }
    </style>
</head>

<body>

    <a href="https://www.wikipedia.org/">click</a>

    <table>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Runs</th>
            <th>Centuries</th>
            <th>Strike Rate</th>
            <th>Avg</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rohit</td>
            <td>10000</td>
            <td>29</td>
            <td>97</td>
            <td>55</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Virat</td>
            <td>12000</td>
            <td>40</td>
            <td>91</td>
            <td>49</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Rahul</td>
            <td>5000</td>
            <td>8</td>
            <td>85</td>
            <td>45</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Rishabh</td>
            <td>4000</td>
            <td>2</td>
            <td>89</td>
            <td>39</td>
        </tr>
    </table>

</body>
</html>
